<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-column field tool. Sticky role bar, task list first, large touch targets for a 7-10 inch tablet. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#e3ebe8; --ink:#14302b; --muted:#566b66; --line:#cdd9d5;
  --accent:#1c6aa8; --accent-ink:#ffffff; --good:#23794d; --warn:#9a6200; --bad:#b3261e;
  --good-bg:#dff1e6; --warn-bg:#fbeccb; --bad-bg:#f9dedb; --info-bg:#dcebf7;
  --font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1917; --surface:#182522; --sunk:#22312d; --ink:#e6efec; --muted:#9db0ab; --line:#33453f;
  --accent:#6db4ea; --accent-ink:#06243a; --good:#6fd09a; --warn:#f0bd5c; --bad:#ff8f86;
  --good-bg:#173625; --warn-bg:#3d2f10; --bad-bg:#45201d; --info-bg:#15303f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1917; --surface:#182522; --sunk:#22312d; --ink:#e6efec; --muted:#9db0ab; --line:#33453f;
  --accent:#6db4ea; --accent-ink:#06243a; --good:#6fd09a; --warn:#f0bd5c; --bad:#ff8f86;
  --good-bg:#173625; --warn-bg:#3d2f10; --bad-bg:#45201d; --info-bg:#15303f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.brand{font-weight:800;font-size:17px;margin-right:auto;min-width:0}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px}
nav button{flex:none}
main{padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:800;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.tab{border-color:transparent;background:transparent;color:var(--muted)}
button.tab.on{background:var(--sunk);color:var(--ink)}
button.link{border:0;background:none;color:var(--accent);padding:4px 0;min-height:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input,textarea{min-height:44px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);max-width:100%}
textarea{width:100%;min-height:96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;background:var(--sunk)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
label.t.miss{color:var(--bad)} label.t.miss::after{content:" *"}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.info{background:var(--info-bg);color:var(--accent)}
.task{border-left:6px solid var(--line)} .task.p1{border-left-color:var(--bad)} .task.p2{border-left-color:var(--warn)} .task.p3{border-left-color:var(--good)}
.q{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q label.t{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-width:88px} .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.multi button{text-align:left;font-weight:600}
.seg.multi button.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.seg.multi.neutral button.on{background:var(--info-bg);color:var(--accent);border-color:var(--accent)}
.seg.multi button.none.on,.seg.multi.neutral button.none.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.q.miss label.t{color:var(--bad)} .q.miss label.t::after{content:" *"}
.big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tblwrap{overflow-x:auto} .tblwrap td:first-child{min-width:150px} .tblwrap th.n{white-space:normal}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap}
td input{min-height:34px;padding:4px 6px;width:84px}
.meter{height:10px;background:var(--sunk);border-radius:5px;position:relative;min-width:110px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.note{background:var(--info-bg);border-radius:var(--r);padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--good)} .dot.off{background:var(--warn)}
.tap{min-height:120px;font-size:22px;width:100%}
h2.rep{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.pair{position:relative;min-width:150px;padding-block:1px}
.pb{height:9px;background:var(--sunk);border-radius:3px;margin-block:2px;position:relative;overflow:hidden}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.pb i.cur,.key.cur{background:var(--accent)} .pb i.c2,.key.c2{background:var(--warn)} .pb i.prv,.key.prv{background:var(--muted);opacity:.6}
.pair>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.key{display:inline-block;width:22px;height:9px;border-radius:3px;vertical-align:middle} .key.tick{width:2px;height:14px;background:var(--ink);border-radius:0}
@media print{
  .bar,.noprint,nav{display:none!important}
  body{background:#fff;font-size:12px} main{padding-block:0} .card{border:0;padding:0;break-inside:avoid} h2.rep{break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Census screens (Enumerators): a different look, so that nobody confuses them with the home-visit screens. */
body.census{--bg:#dcefe0;--accent:#1e6b3a;--info-bg:#d3ebd8;--sunk:#c7e2cd}
body.census .bar{background:#1e6b3a;border-bottom-color:#1e6b3a;color:#fff}
body.census .brand small{color:#d9efdf} body.census .bar select{color:#14302b}
body.census .bar button.tab{color:#e4f3e7} body.census .bar button.tab.on{background:#fff;color:#14302b}
body.census .brand::before{content:"CENSUS";display:inline-block;background:#ffd24d;color:#14302b;border-radius:6px;padding:1px 8px;margin-right:8px;font-size:13px;letter-spacing:.08em;vertical-align:1px}
.say,.do{border-radius:var(--r);padding:12px 14px;font-size:18px;line-height:1.45;color:#14302b}
.say{background:#fff3c4;border-left:6px solid #d99a00} .do{background:#dcebf7;border-left:6px solid #1c6aa8;font-size:16px}
.say::before,.do::before{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:2px}
.say::before{content:"SAY";color:#7a5600} .do::before{content:"DO";color:#174f7d}

.pgpic{display:block;width:100%;max-width:560px;aspect-ratio:800/597;object-fit:cover;border-radius:10px;margin:0 auto 12px;background:#f1ece2}
</style></head>
<body>
<div class="bar"><div class="wrap">
  <div class="brand">CBIO Cardiometabolic Disease Register<small id="who"></small></div>
  <select id="role" aria-label="User"></select>
</div><div class="wrap"><nav id="nav"></nav></div></div>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* CMD Register: home visit register and counselling for hypertension and diabetes.
   Ghana CBIO+ demonstration (The Salvation Army and IGHA). Example mode keeps everything on the device; live mode (live.js) stores records on the tablet and syncs them with Supabase. */
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(new Date());
const dn=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5);
const addD=(s,n)=>{const d=new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))+Math.round(n)*864e5);return d.toISOString().slice(0,10)};
const diff=(a,b)=>dn(a)-dn(b);
const pct=(n,d)=>d?Math.round(100*n/d):null;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmtD=s=>{if(!s)return"";const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return +s.slice(8,10)+" "+m[+s.slice(5,7)-1]+" "+s.slice(0,4)};
let SEQ=0;var LIVE=false;   // live mode: records go to the server, so ids must not collide between tablets
const uid=p=>p+(LIVE?"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7):"")+(++SEQ);

/* ---------- settings ---------- */
const MLEN=30.4375;
const CFG={country:"Ghana",
  // The example programme is in its 8th month of home visits, in the second half of the month.
  start:addD(TODAY,-236),
  noRefer:30,
  declineWait:90,           // days: no new routine referral after a referral is closed as declined, unless the person is now willing (project decision, 23 Nov 2026)               // days: no new routine referral for a person seen at the facility this recently
  recheck:120,              // days: adults 35+ with a normal reading, and households with no patient (3 visits a year)
  // Blood pressure rules: section 4.4 of the demonstration narrative (version 7).
  bp:{hi:[140,90],prompt:[180,110],pregEmerg:[160,110]},
  // Blood glucose, mmol/L and HbA1c %: WHO diagnostic values. For clinical review before field use.
  glu:{fast:7.0,rand:11.1,a1c:6.5,a1cGoal:7.0,fastGoal:7.0,
       emerg:18.0,     // fingerstick at or above this, with or without symptoms: same-day referral
       sick:11.1,      // at or above this WITH a danger sign (vomiting, belly pain, drowsy or confused, deep fast breathing): same-day referral (2024 ADA/EASD hyperglycaemic crises report: DKA possible from 11.1 mmol/L)
       low:3.9,        // below this: low blood sugar, give sugar now (ADA level 1: below 3.9 mmol/L, 70 mg/dL)
       vlow:3.0},      // below this: very low (ADA level 2): give sugar now and refer the same day   // fingerstick at or above this: same-day referral. Draft, from the 18 mmol/L level in WHO HEARTS-D (2020). For clinical review.
  waist:{M:94,F:80},        // cm; raised waist (IDF values used for sub-Saharan Africa). Draft.
  // African Diabetes Risk Score (Mayige 2014; derived in Tanzania, Senegal and Guinea): age, waist and hypertension.
  // Coefficients and cut-off as published for the South African Diabetes Prevention Programme. The cut-off needs a local check.
  adrs:{b0:-11.012,age:.045,waist:.048,htn:.649,cut:3.5},   // cut-off raised from the published 1.46 to keep each Leader Neighbor's cohort near 12 (project decision, 20 Nov 2026)
  targets:{screened:95,aware:70,linked:70,adherent:70,controlled:55,tested:95,dmLinked:70,active:50},
  // Modelled events averted. Relative risk per 10 mmHg lower systolic pressure: Ettehad et al., Lancet 2016;387:957-67.
  // Yearly rates without the fall in pressure are planning assumptions. Replace them with local figures.
  model:{rrCvd:.80,rrCvdLo:.77,rrCvdHi:.83,rrDeath:.87,rrDeathLo:.84,rrDeathHi:.91,cvdRate:1.5,deathRate:2.0},
  };
CFG.census=addD(CFG.start,-75);
const mIdx=d=>Math.floor(diff(d,CFG.start)/MLEN);            // 0 = first month of home visits
const mStart=m=>addD(CFG.start,m*MLEN);
let CUR=clamp(mIdx(TODAY),0,11);
/* Live mode: the administrator sets the date home visits started (Settings). */
function setStart(d){CFG.start=d;CFG.census=addD(d,-75);CUR=clamp(mIdx(TODAY),0,11);}

/* ---------- the 12 monthly group lessons ---------- */
const LESSONS=[
 ["Two quiet conditions and the Four Helpers","Say why a person who feels well still needs to be checked. Name the four daily actions that control both conditions. Choose the Helper to work on first.","Our group agreement; hand signs for the Four Helpers","f_helpers"],
 ["What is high blood pressure?","Explain that high blood pressure usually has no signs. Name the organs it harms.","Water sachet demonstration of pressure","n_bp"],
 ["What is diabetes?","Recognise the signs of high blood sugar. Go for the blood-sugar test at the screening day. Show any sore on the foot to a health worker early.","Picture cards: signs of high sugar","d_signs"],
 ["Know your numbers","Know the two blood pressure numbers and the sugar number. Keep a record card. Know your own target.","Reading two numbers; making a record card","n_card"],
 ["Less salt, and hidden salt","Use no more than one level teaspoon of salt per person per day. Add salt at the end. Keep salt off the table. Limit seasoning cubes, koobi, momoni, tinned and packaged foods.","Measuring the household's daily salt","k_salt"],
 ["Less sugar, more water","Replace minerals, malt and sweetened drinks with water. Cut sugar in tea and porridge.","Spooning out the sugar in one bottle","k_drinks"],
 ["The healthy plate","Fill half the plate with vegetables. Serve smaller portions of kenkey, banku, fufu and rice. Eat two fruits a day and beans most days. Use about one tablespoon of oil per person per day.","Building a plate; planning a week of low-cost stews","k_plate"],
 ["Move more and keep a healthy weight","Walk briskly or do other activity for 30 minutes on at least five days a week. Sit less. Take small steps to lose weight if overweight.","Walking together; chair exercises","w_weight"],
 ["Alcohol, tobacco, stress and sleep","Drink less or no alcohol. Stop smoking. Use slow breathing. Keep a sleep routine. Share worries with someone trusted.","Counting the weekly cost; slow breathing practice","s_stress"],
 ["Medicine every day and every clinic visit","Take medicines every day, including when feeling well. Tie the dose to a daily routine. Keep every review visit. Keep NHIS active.","Making a personal medicine routine; packing the clinic bag","m_routine"],
 ["Low sugar, high sugar and emergencies","Treat low blood sugar at once with sugar. Never skip meals when on diabetes medicine. Recognise the signs of stroke and heart attack. Call 112 and go to hospital at once.","Low-sugar role play; stroke signs role play","e_plan"],
 ["Family support and staying on track","Have eyes, urine and feet checked as the health worker advises. Make a household plan. Eat the same healthy food together. Continue meeting as a group.","Check-up calendar; family pledge","f_family"]];

/* ---------- home-visit counselling pages ----------
   Each page: icon, title, the question the Leader Neighbor asks, the messages, and commitments to choose from.
   Draft text from the Care Group module outline. For clinical review and pre-testing before field use. */
const PAGES={
 m_forget:["pill","Medicine: \"I forget\"","What do you do at the same time every day, without fail?",["The medicine works only on the days you take it.","Tie it to something you do every day: brushing your teeth, the morning meal, evening prayers.","Keep the medicine where you will see it at that time.","Ask one person at home to remind you."],["Take my medicine with the morning meal every day","Keep my medicine beside my toothbrush","A family member reminds me each day"]],
 m_well:["heart","Medicine: \"I feel well\"","How do you feel on the days you take the medicine, and on the days you do not?",["High blood pressure and diabetes are quiet. Most people feel no sign while the harm goes on.","You feel well because the medicine is working.","When the medicine stops, the pressure or the sugar rises again within days.","Only the health worker decides to change or stop a medicine."],["Take my medicine every day, also when I feel well","Go back to the facility this week to restart my medicine"]],
 m_side:["clinic","Medicine: it makes me feel unwell","What do you feel after you take the medicine?",["Some medicines cause problems such as swollen feet, a cough, dizziness or passing urine often.","Do not stop the medicine on your own.","Tell the health worker what you feel. There are other medicines that can be tried.","I will write a referral so that they know why you are coming."],["Go to the facility this week and say what I feel","Keep taking the medicine until I am seen"]],
 m_out:["card","Medicine: it ran out, or the cost","When did the medicine finish, and what stood in the way of getting more?",["With an active NHIS card, medicines for BP and sugar are covered at the facility.","Go for more medicine one week before it finishes.","Put a little money aside each week for transport.","If the NHIS card has expired, renew it now. I can show you how."],["Renew my NHIS card this week","Collect my medicine before it finishes","Save for transport every week"]],
 m_herbs:["leaf","Medicine, herbs and prayer","Besides the medicine from the health facility, what else do you take or do for your BP or sugar?",["Prayer gives strength. Pray, and also take the medicine.","Herbs do not replace the medicine. Some herbs harm the kidneys or change how the medicine works.","Tell the health worker about every herb or mixture you take.","Keep taking the prescribed medicine every day."],["Take my prescribed medicine every day, and keep praying","Tell the health worker about the herbs I use"]],
 m_other:["pill","Medicine: another reason","What makes it hard to take the medicine every day?",["The medicine protects the heart, the brain, the kidneys and the eyes.","Whatever the difficulty, the health worker can help to find a way.","Do not stop on your own. Go back to the facility and explain."],["Go back to the facility this week","Take my medicine every day"]],
 m_routine:["pill","My medicine routine","Show me where you keep your medicine, and tell me when you take it.",["Take the medicine at the same time every day.","Take it also when you feel well, when you fast, and when you travel.","Carry your medicines and your record card to every clinic visit.","Know the date of your next review."],["Take my medicine at the same time every day","Put my next review date where the family can see it"]],
 c_review:["calendar","A missed clinic review","What stood in the way of going for your review?",["The review visit is where the health worker checks whether the medicine is working.","Go even when you feel well, and even when medicine remains.","Someone from the corps can go with you if you wish.","Let us choose the day now."],["Go for my review on the day we chose","Go with a companion"]],
 c_between:["cuff","Checking between clinic visits","Where do you have your BP or sugar checked between clinic visits, and what do you do with the result?",["I will check your blood pressure at every visit and write it on your card.","Show the card to the health worker at each review.","If I find a high reading, I will refer you. Please go."],["Keep my record card and take it to every review"]],
 r_raised:["cuff","A raised reading today","Has anyone told you before that your blood pressure was high?",["Your reading is raised today. One reading does not show that you have a condition.","Pressure goes up with worry, pain, coffee or a rushed day.","I will check again at my next visit, within one month.","If it is raised again, I will refer you to the facility to be sure."],["Be at home for the re-check","Rest for five minutes before the next check"]],
 n_bp:["cuff","What high blood pressure does","Why does a person who feels well still need a check?",["High blood pressure usually has no signs.","Over years it harms the brain, the heart, the kidneys and the eyes.","The only way to know is to measure.","Every adult aged 35 or older in this house should be checked."],["Every adult in this house has a check this year"]],
 n_card:["card","Know your numbers","May we look at your record card together?",["Blood pressure has two numbers. For most adults the aim is below 140 over 90.","Your health worker may give you your own target.","Write each reading on the card with the date.","A person with diabetes also has a sugar number. Ask the health worker for yours."],["Keep my record card in one place","Ask the health worker for my target"]],
 d_signs:["drop","Signs of high blood sugar","Have you noticed great thirst, passing urine often, tiredness, or a sore that is slow to heal?",["Many people with diabetes have no signs for years.","Signs include great thirst, passing urine often, tiredness, blurred sight, and sores that heal slowly.","A small blood test from the finger shows the sugar level.","Every adult aged 35 or older should have the test at the screening day."],["Go for the blood-sugar test at the next screening day"]],
 d_test:["drop","Not yet tested for sugar","Have you ever had your blood sugar tested?",["The nurse does a finger test at the community screening day.","It takes a few minutes.","Every adult aged 35 or older should have it.","I will put your name down for the next screening day."],["Come to the next screening day"]],
 d_feet:["foot","Foot check","May we look at your feet together?",["Diabetes can take away feeling in the feet, so a sore may not hurt.","Check and wash your feet every day, and dry between the toes.","Never walk barefoot. Check inside your shoes before you put them on.","Show any sore, blister or dark spot to a health worker the same day."],["Check my feet every evening","Never walk barefoot","A family member checks the soles of my feet each week"]],
 d_low:["drop","When blood sugar is too low","When you felt shaky or sweaty, what did you do?",["Diabetes medicine can take the sugar too low, most often after a missed meal.","Signs: shaking, sweating, hunger, confusion.","Take sugar at once: about three teaspoons of sugar in water, or a sweet drink. Then eat a meal.","Never skip meals when you take diabetes medicine. Tell the health worker that it happened."],["Never skip a meal","Keep sugar or a sweet drink within reach","Tell the health worker at my next visit"]],
 k_salt:["salt","Kitchen: hidden salt","Which seasonings and salted foods went into yesterday's main meal?",["One level teaspoon of salt per person per day is enough, from all sources.","Seasoning cubes, koobi, momoni, tinned fish and tomato paste all carry salt.","Use one cube where you used two. Flavour with onion, ginger, garlic, pepper and herbs.","Add salt at the end of cooking, and keep salt off the table."],["Use half the seasoning cubes in our stew","Keep salt off the table","Cook with onion, ginger and garlic for flavour"]],
 k_drinks:["bottle","Drinks","What did you drink yesterday?",["One bottle of minerals or malt holds many spoons of sugar.","Sweet drinks raise the sugar in the blood and add weight.","Water is the best drink. Keep drinking water within reach.","Cut the sugar in tea and porridge by half, then by half again."],["Replace one sweet drink a day with water","Take tea and porridge with half the sugar"]],

  if(preg&&hi)return{urg:2,code:"preg",t:"Refer now. In pregnancy, one raised reading is enough.",refer:1};

function tasks(lnId){const out=[];
  for(const h of IX.lnH[lnId]||[]){const ps=(IX.hhP[h.id]||[]).filter(alive);if(!ps.length)continue;
    // due when the referral is urgent or more than 14 days old, and no follow-up has been recorded recently (3 days if urgent, 14 if routine)
    const refs=ps.flatMap(openRef),urgent=refs.filter(r=>{const f=lastFu(r);return(r.urg<3||diff(TODAY,r.d)>14)&&!(f&&diff(TODAY,f.d)<(r.urg<3?3:14));});
    if(urgent.length)out.push({p:1,h,fu:urgent[0].p,t:"Follow up a referral",why:urgent.map(r=>{const f=lastFu(r);return IX.p[r.p].name+": "+rz(r.code)+", referred "+fmtD(r.d)+(f?". Last follow-up "+fmtD(f.d)+": "+FUST[f.st].toLowerCase():". No follow-up recorded yet");}).join("; ")});
    const monthly=hhMonthly(h);
    if(monthly&&(!h.last||mIdx(h.last)!==CUR)){const why=[];let pr=2,first=0;
      for(const p of ps){const l=lastBP(p),lv=S.v.filter(v=>v.p===p.id).pop();
        const st=[p.htn,p.dm].filter(c=>c.rx&&c.rxStart&&!c.rxPre&&diff(TODAY,c.rxStart)<=60&&!(lv&&lv.d>=c.rxStart)).map(c=>c.rxStart).sort()[0];
        if(st){why.push(p.name+": first visit since treatment started on "+fmtD(st));pr=1;first=1;}
        else if((p.htn.dx&&!p.htn.rx)||(p.dm.dx&&!p.dm.rx)){why.push(p.name+": diagnosed, not on treatment");pr=1;}
        else if(inCare(p)&&lv&&lv.med==="n"){why.push(p.name+" said at the last visit that the medicine was not taken every day");pr=1;}
        else if(raisedOnce(p)){why.push(p.name+": re-check a raised reading");pr=1;}
        else if(l&&(l.s>=160||l.di>=100)){why.push(p.name+": last reading "+bpTxt(l));pr=1;}
        else if(onTB(p)){why.push(p.name+": on TB treatment, monthly visit");}

   With a module off, nothing of it is shown and nothing is asked; records already collected are kept and come back when it is switched on.
   TB facts are kept on the person record (p.tb). The yearly HIV test question is kept on the person record (p.hq) and holds no result.
   That a person is on ART is kept in a separate record (S.hv, one per person), which the server sends to a Leader Neighbor
   only when the person has agreed that this Leader Neighbor may know (lnOk). No HIV test result is stored anywhere. */
CFG.mods={tb:false,hiv:false};
const modOn=k=>!!(CFG.mods&&CFG.mods[k]);
const MODDRAFT="Draft for review, not yet pre-tested or clinically reviewed";
Object.assign(PAGES,{
 tb_what:["drop","TB: what it is, and why to get tested","How long have you had this cough, fever, night sweating or loss of weight?",["TB is a disease caused by a germ. It spreads through the air when a person with TB in the lungs coughs.","The signs are a cough that does not go away, fever, sweating at night and losing weight.","TB can be cured. The test and the medicine are given at the health facility.","The sooner you are tested, the sooner you are well, and the safer your family is.","I will write a referral so that the facility expects you."],["Go for the TB test this week","Cover my mouth and nose when I cough"]],
 tb_daily:["pill","TB medicine: every day until the end","How are you getting on with the TB medicine?",["TB medicine is taken every day for the full course, usually six months.","You will feel better after a few weeks, but the germ is still in the body. Stopping early lets it come back, and it is then harder to cure.","If the medicine makes you feel unwell, do not stop. Tell the health worker the same day.","Keep every clinic visit, and collect the next supply before this one finishes."],["Take my TB medicine at the same time every day","A family member is with me when I take it","Go to every clinic visit until the health worker says the treatment is complete"]],
 tb_house:["family","TB: protecting the household","Who lives and sleeps in this house with you?",["Cover your mouth and nose with a cloth or your elbow when you cough or sneeze.","Keep windows and doors open so that air moves through the house.","Everyone who lives in the house should be checked for TB at the facility, above all children under 5.","Taking the medicine every day is what protects the family most."],["Take everyone in the house for a TB check","Keep the windows open during the day"]],
 hiv_know:["card","Why to know your HIV status","What have you heard about the HIV test?",["Many people with HIV feel well for years. Only a test can tell.","The test is quick and private. The result is given to you alone.","With treatment, a person with HIV can live a long and healthy life.","A person on treatment whose virus is fully controlled does not pass HIV to a sexual partner.","I will not ask for your result, now or later. I can write a referral if you would like a test."],["Go for an HIV test this month","Go for the test together with my partner"]],
 hiv_art:["pill","Taking ART every day","How are you getting on with your medicine?",["The medicine keeps the virus low, so that the body stays strong.","Take it every day at the same time, also when you feel well.","Do not stop the medicine and do not share it. If it makes you feel unwell, tell the health worker.","Keep every clinic visit, and collect the next supply before this one finishes.","What you tell me stays private."],["Take my medicine at the same time every day","Collect my next supply before this one finishes"]]});
const MODPAGES={tb:["tb_what","tb_daily","tb_house"],hiv:["hiv_know","hiv_art"]};
const isModPage=k=>MODPAGES.tb.includes(k)||MODPAGES.hiv.includes(k);
const pgroups=()=>PGROUPS.concat(modOn("tb")?[["TB module ("+MODDRAFT.toLowerCase()+")",MODPAGES.tb]]:[],modOn("hiv")?[["HIV module ("+MODDRAFT.toLowerCase()+")",MODPAGES.hiv]]:[]);
const porder=()=>pgroups().flatMap(g=>g[1]);
Object.assign(REASON,{tb:"TB test",hivtest:"HIV test"});
/* referrals of a module that is switched off are hidden, not deleted */
const rOn=r=>(r.code!=="tb"||modOn("tb"))&&(r.code!=="hivtest"||modOn("hiv"));
/* reason shown on screen: a neutral label for the HIV test wherever a family member could read it */
const rz=c=>c==="hivtest"&&!["clinic","prom","lnt"].includes(me().role)?"Test at the facility":REASON[c];

/* TB */
const TBSYM=["Cough","Fever","Night sweats","Weight loss without trying"];
const TBOUT={completed:"Treatment completed",cured:"Cured",stopped:"Stopped",died:"Died",moved:"Moved"};
const TBASK=90;   // days before the symptom questions are asked again
const onTB=p=>modOn("tb")&&!!(p.tb&&p.tb.rx&&p.tb.rx.start&&!p.tb.rx.out);
const tbRef=p=>S.ref.some(r=>r.p===p.id&&r.code==="tb"&&refOpen(r));
const tbAsk=p=>modOn("tb")&&p.age>=15&&!onTB(p)&&!tbRef(p)&&!(p.tb&&p.tb.asked&&diff(TODAY,p.tb.asked)<TBASK);
/* HIV */
const HVROLES=["clinic","prom","lnt"];
const hvRec=p=>modOn("hiv")?(IX.hv||{})[p.id]||null:null;
const hvSee=p=>{const r=hvRec(p),ro=me().role;return !!(r&&r.art&&(HVROLES.includes(ro)||(ro==="ln"&&r.lnOk)));};
const artLn=p=>{const r=hvRec(p);return !!(r&&r.art&&r.lnOk);};   // the same answer for every user, so that the visit schedule does not differ between tablets
const hivAsk=p=>modOn("hiv")&&p.age>=18&&["ln","lnt"].includes(me().role)&&!hvSee(p)&&!(p.hq&&diff(TODAY,p.hq.d)<365);
const HQ=[["y","Yes"],["n","No, more than 12 months ago"],["never","Never tested"],["ns","Prefers not to say"],["skip","Not asked today: we were not alone"]];
const hqOffer=F=>F.hq==="n"||F.hq==="never";
const modMeds=p=>(onTB(p)?["TB medicine"]:[]).concat(hvSee(p)?["Clinic medicine (private)"]:[]);
const allMeds=p=>p.meds.concat(modMeds(p));
const modCare=p=>onTB(p)||hvSee(p);
/* What may be shown in a visit history: HIV pages and commitments never (a family member may read the screen); TB ones only while the module is on. */
const pgShow=k=>!MODPAGES.hiv.includes(k)&&(!MODPAGES.tb.includes(k)||modOn("tb"));
const modCommits=ks=>new Set(ks.flatMap(k=>PAGES[k][4]));
const commitKeep=c=>(c||"").split("; ").filter(x=>x&&!modCommits(MODPAGES.hiv).has(x)).join("; ");
const commitShow=c=>(c||"").split("; ").filter(x=>x&&!modCommits(MODPAGES.hiv).has(x)&&(modOn("tb")||!modCommits(MODPAGES.tb).has(x))).join("; ");

/* the home visit */
function modFind(F,p,find,when){
  if(when==="pre"){if(tbAsk(p)&&F.tbs.some(x=>x!=="__none"))find.push("tb_what");return;}
  if(onTB(p)){if(F.tbc&&F.tbc!=="all")find.push("tb_house");if(F.med==="n"||F.nV%3===0)find.push("tb_daily");}
  if(hivAsk(p)&&hqOffer(F))find.push("hiv_know");
  if(hvSee(p)&&(F.med==="n"||F.nV%3===0))find.push("hiv_art");}
const modStep1=(F,p,miss)=>tbAsk(p)?q("TB check. Do you have any of these?",multi("tbs",TBSYM,F.tbs,false,"None of these"),miss(!F.tbs.length),"Ask about each one in turn."):"";
const modStep3=(F,p,miss)=>onTB(p)?q("Have the other people who live in this house been checked for TB at the facility?",seg("tbc",[["all","Yes, all of them"],["some","Some of them"],["none","None of them"]],F.tbc),miss(!F.tbc),"Ask above all about children under 5."):"";
const modPrivate=(F,p,miss)=>hivAsk(p)?'<div class="card"><h3>A private question</h3>'+todo("Ask this only when nobody else can hear. If you cannot be alone with the person today, tap the last choice and ask at the next visit. Never ask for a test result, and never write one down.")+
  q("Have you had an HIV test in the last 12 months?",seg("hq",HQ,F.hq),miss(!F.hq))+(hqOffer(F)?q("Would you like a referral for a test?",seg("hoff",YN,F.hoff),miss(!F.hoff),"Show the page below first. The choice is the person's own."):"")+"</div>":"";
const modMiss=(F,p)=>(tbAsk(p)&&!F.tbs.length)||(onTB(p)&&!F.tbc)||(hivAsk(p)&&(!F.hq||(hqOffer(F)&&!F.hoff)));
function modSave(F,p,v){let t="";
  if(tbAsk(p)){const sym=F.tbs.filter(x=>x!=="__none");p.tb=Object.assign({},p.tb,{asked:TODAY,sym});v.tbs=sym;
    if(sym.length){p.tb.posD=TODAY;S.ref.push({id:uid("r"),p:p.id,d:TODAY,by:UI.who,code:"tb",urg:2});t+=" TB symptoms: referred for a TB test, to be seen within days.";}}
  if(onTB(p)&&F.tbc){p.tb=Object.assign({},p.tb,{contacts:{d:TODAY,ans:F.tbc}});v.tbc=F.tbc;}
  if(hivAsk(p)&&F.hq&&F.hq!=="skip"){p.hq={d:TODAY,ans:F.hq};if(hqOffer(F)){p.hq.off=F.hoff;
      if(F.hoff==="y"&&!S.ref.some(r=>r.p===p.id&&r.code==="hivtest"&&refOpen(r))){S.ref.push({id:uid("r"),p:p.id,d:TODAY,by:UI.who,code:"hivtest",urg:3});t+=" A referral for a test is recorded.";}}}
  return t;}

/* person record */

function vHv(){const F=UI.F,p=IX.p[F.pid],r=me().role,miss=k=>F.tried&&k;

/* clinic entry */

  return '<div class="card"><h3>TB</h3>'+(t.asked&&t.sym&&t.sym.length?'<p class="small">Symptoms reported at the home visit on '+fmtD(t.asked)+": "+esc(t.sym.join(", "))+".</p>":"")+(t.test?'<p class="small">Earlier test, '+fmtD(t.test.d)+": "+(t.test.res==="pos"?"TB found":"no TB found")+".</p>":"")+

/* ---------- census (Enumerators) ----------
   The census is done once, before Care Groups are formed, by temporary Enumerators working in pairs.
   A census household belongs to the Enumerator account that entered it (h.ln) until the administrator
   gives it to a Leader Neighbor. h.cen holds the census facts: {st,d,by,gps,lm,ph,kids,tries,cbTime}.
   The screens are written for people with little training: one step per screen, with the words to say. */
const CZ={good:15,poor:50,full:35};   // metres for a good and a poor location fix; age for the full set of questions and measurements
const CST={done:["Completed","good"],cb:["Call back","warn"],ref:["Refused","bad"],vac:["Vacant, or not a home",""]};
/* outcomes at the door that lead to a call-back, and the words shown for each */

const czHh=id=>S.hh.filter(h=>h.ln===id&&h.cen);
const czNo=()=>"C-"+UI.who.replace(/^w_/,"").slice(-3).toUpperCase()+"-"+String(S.hh.filter(h=>h.ln===UI.who).length+1).padStart(3,"0");
const czPend=h=>(IX.hhP[h.id]||[]).filter(p=>p.cen&&p.cen.st==="absent"&&alive(p));
const czBack=id=>czHh(id).filter(h=>h.cen.st==="cb"||(h.cen.st==="done"&&czPend(h).length));
const say=t=>'<div class="say">'+t+"</div>",todo=t=>'<div class="do">'+t+"</div>";
const cseg=(path,opts,val)=>'<div class="seg">'+opts.map(o=>'<button data-cf="'+path+'" data-v="'+esc(o[0])+'" class="'+(String(val)===String(o[0])?"on":"")+'">'+esc(o[1])+"</button>").join("")+"</div>";
const cnum=(path,val,ph,w)=>'<input type="number" inputmode="decimal" data-ci="'+path+'" value="'+esc(val??"")+'" placeholder="'+esc(ph||"")+'" style="width:'+(w||110)+'px">';
const ctxt=(path,val,ph)=>'<input data-ci="'+path+'" value="'+esc(val??"")+'" placeholder="'+esc(ph||"")+'" style="width:100%">';
const getPath=(o,path)=>path.split(".").reduce((a,k)=>a==null?a:a[k],o);

/* location */
function gpsHtml(o){const g=o.gps;let h="";
  if(o.gpsBusy)h+='<p><span class="chip info">Finding the location… keep the tablet still, under open sky</span></p>';
  else if(g)h+='<p><span class="chip '+(g.acc<=CZ.good?"good":g.acc<=CZ.poor?"warn":"bad")+'">Location saved, accurate to about '+Math.round(g.acc)+" m</span></p>"+
    (g.acc>CZ.good?'<p class="small">'+(g.acc>CZ.poor?"<b>This is a poor fix.</b> ":"")+"For a better fix, step outside, away from walls and roofs, hold the tablet flat and still, and tap Try again. If it does not improve after two tries, carry on and describe the place well below.</p>":"");
  else if(o.gpsMsg)h+='<div class="note warn">'+esc(o.gpsMsg)+"</div>";
  return h+'<div class="row"><button class="'+(g?"":"pri")+'" data-act="czgps">'+(g?"Try again":"Record the location of this house")+"</button></div>";}
function czLocate(o){if(!navigator.geolocation){o.gpsMsg="This tablet cannot give a location. Describe the place well below.";UI.keep=true;return render();}
  o.gpsBusy=true;o.gpsMsg="";UI.keep=true;render();
  navigator.geolocation.getCurrentPosition(p=>{o.gpsBusy=false;const g={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:Date.now()};
      if(!o.gps||g.acc<=o.gps.acc)o.gps=g;if(UI.F===o||UI.gt===o){UI.keep=true;render();}if(typeof afterAction==="function")afterAction();},
    e=>{o.gpsBusy=false;o.gpsMsg=e.code===1?"Location is switched off for this app. Ask the supervisor to allow it. For now, describe the place well below.":"No location found. Step outside, away from walls and roofs, and try again. If it still fails, describe the place well below.";if(UI.F===o||UI.gt===o){UI.keep=true;render();}},
    {enableHighAccuracy:true,timeout:30000,maximumAge:0});}

function czMissing(F){const a=F.ad[F.i];

/* saving */
function czPerson(h,a,F){let p=a.pid?IX.p[a.pid]:null;const seen=a.here==="y";
  if(!p){p={id:uid("p"),hh:h.id,name:a.name.trim(),sex:a.sex,age:+a.age,bp:[],glu:[],htn:{},dm:{},meds:[]};S.p.push(p);}
  if(!seen){p.cen=F.revisit?{st:"left",d:TODAY}:{st:+a.age>=CZ.full?"absent":"listed",d:TODAY};return;}
  p.cen={st:"seen",d:TODAY};

  if(a.dxH==="y")p.htn=Object.assign({dx:true,src:"self",base:true},a.rxH==="y"?{rx:true,rxStart:TODAY,rxPre:true}:{});
  if(a.dxD==="y")p.dm=Object.assign({dx:true,src:"self",base:true},a.rxD==="y"?{rx:true,rxStart:TODAY,rxPre:true}:{});
  if(!czFull(a))return;
  if(a.st){const st=a.st==="y",mi=a.mi==="y";p.cvd={st,mi,d:st||mi?TODAY:null,by:UI.who};}
  if(a.fam){p.fam=a.fam==="y";p.riskD=TODAY;}if(a.prev)p.prevSugar=a.prev==="y";if(a.preg)p.preg=a.preg==="y";
  if(+a.ht>=100&&+a.ht<=230)p.ht=+a.ht;if(+a.waist>=40&&+a.waist<=200)p.waist=+a.waist;
  const d=czDec(a);if(d){p.bp.push({d:TODAY,s:d.s,di:d.di,by:UI.who,src:"census",raw:a.r.filter(x=>+x[0]&&+x[1]).map(x=>[+x[0],+x[1]])});
    if(d.urg===1||d.urg===2)S.ref.push({id:uid("r"),p:p.id,d:TODAY,by:UI.who,code:d.code,urg:d.urg});}}
function czSave(){const F=UI.F;let h=F.hid?IX.hh[F.hid]:null;
  if(F.revisit){for(const a of F.ad)czPerson(h,a,F);index();UI.note=[h.no+": call-back saved.",""];}
  else if(F.out!=="home"){const st=CZCB[F.out]?"cb":F.out,c={st,why:CZCB[F.out]?F.out:undefined,d:TODAY,by:UI.who,gps:F.gps||null,lm:F.lm.trim(),ph:F.ph,cbTime:F.cbTime.trim(),tries:h?(h.cen.tries||1)+1:1};

    h.head=h.cen.st==="cb"?CZCB[F.out]+": "+(F.lm.trim()||"place not described"):h.head;
    index();UI.note=[h.no+": saved as "+(CZCB[F.out]?CZCB[F.out].toLowerCase()+", for a call-back":CST[F.out][0].toLowerCase())+".",""];}

    const keys=Object.keys(L.dirty);
    for(let i=0;i<keys.length;i+=200){const batch=keys.slice(i,i+200).map(k=>{const [ty,id]=k.split("|"),r=S[ty].find(x=>x.id===id);return r&&!r.hidden?{ty,id,ln:ownerOf(ty,r),u:L.meta[k]||Date.now(),body:r}:null;}).filter(Boolean);
      if(batch.length)await rpc("cmd_push",{p_token:L.auth.token,p_records:batch});
      for(const k of keys.slice(i,i+200))delete L.dirty[k];}
    await refreshWorkers();
    const cfg=await rpc("cmd_settings_get",{p_token:L.auth.token});applyCfg(cfg);lastCfg=JSON.stringify(cfgPart());
    let got=0,guard=0;
    while(guard++<200){const r=await rpc("cmd_pull",{p_token:L.auth.token,p_since:L.seq});got+=applyPulled(r.records||[]);L.seq=r.seq||L.seq;if(!r.count||r.count<1000)break;}
    index();scan();L.dirty={...L.dirty};L.last=Date.now();
    L.syncMsg="Synced "+new Date(L.last).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+(Object.keys(L.dirty).length?" · "+Object.keys(L.dirty).length+" changes waiting":"");store();
    if(got&&!UI.F&&!UI.G)render();
  }catch(e){L.syncMsg=e.code==="offline"?"Offline. "+Object.keys(L.dirty).length+" changes waiting.":errText(e.code);if(e.code==="not_signed_in"){L.auth.token=null;store();render();}}
  finally{L.busy=false;hdr();}}
addEventListener("online",()=>sync());
setInterval(()=>{if(live()&&document.visibilityState==="visible")sync();},5*60*1000);

/* sign-in, first-time setup, sign-out */
async function signIn(fn,args){L.msg="";try{const res=await rpc(fn,args);if(!res||!res.ok){L.msg=errText(res&&res.error||"server");return render();}
    const same=L.auth&&L.auth.worker&&L.auth.worker.id===res.worker.id;if(!same)wipeRecords();   // a different worker never sees the previous worker's records
    if(!same)setStart(TODAY);L.mode="live";LIVE=true;L.auth={token:res.token,worker:res.worker};UI.who=res.worker.id;if(!S.w.some(w=>w.id===res.worker.id))S.w.push(res.worker);index();
    UI.tab=null;UI.mode=null;store();render();await sync();render();}
  catch(e){L.msg=errText(e.code);render();}}
async function signOut(){if(Object.keys(L.dirty).length&&!confirm("Some changes have not reached the server yet. Sign out anyway? They stay on this tablet only if the same worker signs in again."))return;
  try{if(L.auth&&L.auth.token)await rpc("cmd_logout",{p_token:L.auth.token});}catch(e){}
  L.auth=Object.assign({},L.auth,{token:null});store();render();}

/* screens */
const fld=(id,label,type,extra)=>'<div class="q"><label class="t" for="'+id+'">'+esc(label)+'</label><input id="'+id+'" type="'+(type||"text")+'" '+(extra||"")+' style="width:100%"></div>';
function vWelcome(){const w=L.welcome,m=L.msg?'<div class="note bad">'+esc(L.msg)+"</div>":"";
  $("#nav").innerHTML="";$("#role").hidden=true;$("#who").textContent=SERVER.url?"":"Example mode only";
  if(w==="login")return '<div class="card"><h1>Sign in</h1>'+m+fld("li_code","Sign-in name","text",'autocapitalize="none" autocomplete="username"')+fld("li_pin","PIN","password",'inputmode="numeric" autocomplete="current-password"')+'<div class="row"><button class="pri" data-act="login">Sign in</button><button data-act="welcome" data-w="start">Back</button></div></div>';
  if(w==="setup")return '<div class="card"><h1>First-time setup (administrator only)</h1><p class="muted">This creates the administrator account. It works once, on a server with no administrator yet.</p>'+m+fld("su_name","Name")+fld("su_code","Sign-in name","text",'autocapitalize="none" autocomplete="off"')+fld("su_pin","PIN (6 or more digits)","password",'inputmode="numeric"')+fld("su_pin2","PIN again","password",'inputmode="numeric"')+'<div class="row"><button class="pri" data-act="setup">Create the administrator</button><button data-act="welcome" data-w="start">Back</button></div></div>';
  return '<div class="card"><h1>CBIO Cardiometabolic Disease Register</h1><p>A home visit register with counselling pages for hypertension and diabetes, for the Ghana CBIO+ demonstration.</p>'+m+
    '<div class="row"><button class="pri tap" data-act="example">Try it with example data</button>'+(SERVER.url?'<button class="tap" data-act="welcome" data-w="login">Sign in</button>':"")+"</div>"+
    '<p class="small muted">Example data is fictitious and stays on this device. '+(SERVER.url?"Signing in uses the project database; records are kept on the tablet and sent to the server when there is a connection.":"This copy is not yet connected to a server.")+"</p>"+
    (SERVER.url?'<p class="small"><button class="link" data-act="welcome" data-w="setup">First-time setup (administrator only)</button></p>':"")+"</div>";}
function hdr(){if(!live()||!me())return;const w=me();$("#who").textContent=ROLE[w.role]+(w.role==="admin"?"":": "+w.name)+" · "+(L.syncMsg||"not yet synced");}
function liveCard(){const n=Object.keys(L.dirty).length;
  return "<div class='card'><h3>Data and sign-in</h3><p class='small'>Signed in as "+esc(me().name)+" ("+esc(ROLE[me().role])+"). Records are kept on this tablet and sent to the server when there is a connection."+(L.last?" Last sync: "+new Date(L.last).toLocaleString()+".":"")+" "+n+" change"+(n===1?"":"s")+" waiting to be sent.</p>"+
    (L.syncMsg?"<p class='small muted'>"+esc(L.syncMsg)+"</p>":"")+"<div class='row'><button data-act="+'"syncnow"'+">Sync now</button><button data-act="+'"signout"'+">Sign out</button></div></div>";}
function vAccount(){return "<h1>Account</h1>"+liveCard();}

/* programme start date (administrator) */
function startCard(){return "<div class='card'><h3>Programme calendar</h3><div class='row'><label>Home visits started on <input type='date' data-cfgstart='1' value='"+esc(CFG.start)+"'"+(me().role==="admin"?"":" disabled")+"></label></div><p class='small muted'>The month of the programme (1 to 12) and the group lesson for each month are counted from this date. The census is taken to have been about 10 weeks earlier.</p></div>";}

/* workers (administrator, live mode) */
function vWorkersLive(){const g=r=>S.w.filter(w=>w.role===r&&w.active!==false),sel=(id,arr,lab)=>'<select id="'+id+'">'+arr.map(w=>'<option value="'+w.id+'">'+esc(lab(w))+"</option>").join("")+"</select>";
  const row=w=>"<tr><td>"+esc(ROLE[w.role])+"</td><td>"+esc(w.name)+"</td><td>"+esc(w.code||"")+"</td><td>"+(w.role==="lnt"?"Care Group "+w.cg+(w.prom&&IX.w[w.prom]?" · Promoter "+esc(IX.w[w.prom].name):""):w.role==="ln"?"Care Group "+w.cg+(w.lnt&&IX.w[w.lnt]?" · Trainer "+esc(IX.w[w.lnt].name):""):"")+"</td></tr>";
  const add=(title,role,extra)=>"<div class='card'><h3>"+title+"</h3><div class='row'><input id='nw_"+role+"_name' placeholder='Name' class='grow'><input id='nw_"+role+"_code' placeholder='Sign-in name' autocapitalize='none' style='width:150px'><input id='nw_"+role+"_pin' placeholder='PIN (6+ digits)' inputmode='numeric' style='width:140px'>"+(extra||"")+"<button data-act='addworker' data-role='"+role+"'>Add</button></div></div>";
  let o="<h1>Workers</h1>"+(L.msg?'<div class="note">'+esc(L.msg)+"</div>":"");L.msg="";
  o+="<div class='card'>"+tbl(["Role","Name","Sign-in name","Covers"],["admin","prom","clinic","lnt","ln","enum"].flatMap(r=>g(r).map(row)))+"</div>";
  o+=add("Add a Promoter (CHO)","prom")+add("Add a clinic user","clinic")+add("Add an Enumerator pair (census). One sign-in name and one tablet for each pair","enum");
  o+=g("prom").length?add("Add a Leader Neighbor Trainer (starts a new Care Group)","lnt",sel("nw_lnt_sup",g("prom"),w=>"Promoter: "+w.name)):"<div class='card'><p class='muted'>Add a Promoter first. Each Trainer belongs to a Promoter.</p></div>";
  o+=g("lnt").length?add("Add a Leader Neighbor","ln",sel("nw_ln_sup",g("lnt"),w=>"Care Group "+w.cg+" · "+w.name)):"<div class='card'><p class='muted'>Add a Trainer first. Each Leader Neighbor belongs to a Trainer's Care Group.</p></div>";
  const all=S.w.filter(w=>w.role!=="admin"&&w.active!==false);
  if(all.length)o+="<div class='card'><h3>Give a worker a new PIN, or remove a worker</h3><div class='row'>"+sel("pw_who",all,w=>ROLE[w.role]+" · "+w.name)+"<input id='pw_pin' placeholder='New PIN (6+ digits)' inputmode='numeric' style='width:170px'><button data-act='setpin'>Set PIN</button><button data-act='deactivate'>Remove</button></div><p class='small muted'>A removed worker can no longer sign in. Her households and records stay; give them to another Leader Neighbor before removing her.</p></div>";
  return o;}
async function refreshWorkers(){const ws=await rpc("cmd_workers_list",{p_token:L.auth.token});if(Array.isArray(ws)){S.w.length=0;S.w.push(...ws);index();store();}}
async function saveWorker(body,pin){try{const r=await rpc("cmd_save_worker",{p_token:L.auth.token,p_worker:body,p_pin:pin||""});L.msg=r&&r.ok?"Saved: "+r.worker.name+(r.worker.code?" (sign-in name "+r.worker.code+")":""):errText(r&&r.error||"server");await refreshWorkers();}
  catch(e){L.msg=errText(e.code);}render();}

/* add a household (Leader Neighbor or Trainer) */
function vAddHh(){const w=me(),lns=w.role==="ln"?[w]:S.w.filter(x=>x.role==="ln"&&x.lnt===w.id&&x.active!==false);
  if(!lns.length)return '<button class="link" data-act="back">‹ Back</button><div class="card"><p>This Care Group has no Leader Neighbors yet. The administrator adds them on the Workers page.</p></div>';
  return '<button class="link" data-act="back">‹ Back</button><h1>Add a household</h1><div class="card">'+fld("nh_head","Head of household: name")+
    '<div class="row"><div class="q grow"><label class="t" for="nh_sex">Sex</label><select id="nh_sex"><option value="F">Woman</option><option value="M">Man</option></select></div><div class="q grow"><label class="t" for="nh_age">Age in years</label><input id="nh_age" type="number" min="18" max="110" inputmode="numeric"></div></div><p class="small muted">The head of household is added as the first adult. Add the other adults on the next screen.</p>'+
    (lns.length>1||w.role!=="ln"?'<div class="q"><label class="t" for="nh_ln">Leader Neighbor</label><select id="nh_ln">'+lns.map(l=>'<option value="'+l.id+'">'+esc(l.name)+"</option>").join("")+"</select></div>":"")+
    '<div class="q"><label class="t" for="nh_nhis">National Health Insurance (NHIS) active?</label><select id="nh_nhis"><option value="">Not known</option><option value="y">Yes</option><option value="n">No</option></select></div>'+
    (L.msg?'<div class="note bad">'+esc(L.msg)+"</div>":"")+'<div class="row"><button class="pri" data-act="savehh">Save and add the adults</button></div></div>';}
function saveHh(){const head=$("#nh_head").value.trim();const hsex=$("#nh_sex").value,hage=+$("#nh_age").value,bad=!head?"Enter the name of the head of household.":!(hage>=18&&hage<=110)?"Enter the age of the head of household (18 or older).":"";
  if(bad){const keep={nh_head:head,nh_sex:hsex,nh_age:$("#nh_age").value,nh_nhis:$("#nh_nhis").value,nh_ln:($("#nh_ln")||{}).value};L.msg=bad;render();for(const k in keep){const e=$("#"+k);if(e&&keep[k]!=null)e.value=keep[k];}return;}L.msg="";
  const lnId=($("#nh_ln")||{}).value||me().id,ln=IX.w[lnId],h={id:uid("h"),ln:lnId,no:"CG"+(ln.cg||"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase(),head,nhis:$("#nh_nhis").value==="y",topics:[],reg:TODAY};
  S.hh.push(h);S.p.push({id:uid("p"),hh:h.id,name:head,sex:hsex,age:hage,bp:[],glu:[],htn:{},dm:{},meds:[]});index();UI.hh=h.id;UI.mode="hh";render();}

/* actions */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset,A=d.act;
  if(A==="welcome"){L.welcome=d.w;L.msg="";return render();}
  if(A==="example"){L.mode="example";LIVE=false;for(const ty of TYPES)S[ty].length=0;S.w.length=0;SEQ=0;build();index();roleSel();$("#role").hidden=false;UI.tab=null;UI.mode=null;return render();}
  if(A==="login")return signIn("cmd_login",{p_code:$("#li_code").value,p_pin:$("#li_pin").value});
  if(A==="setup"){if($("#su_pin").value!==$("#su_pin2").value){L.msg="The two PINs are not the same.";return render();}return signIn("cmd_bootstrap",{p_name:$("#su_name").value,p_code:$("#su_code").value,p_pin:$("#su_pin").value});}
  if(A==="syncnow")return sync().then(render);
  if(A==="signout")return signOut();
  if(A==="addhh"){L.msg="";UI.back=UI.tab;UI.mode="addhh";return render();}
  if(A==="savehh")return saveHh();
  if(A==="addworker"){const r=d.role,v=k=>($("#nw_"+r+"_"+k)||{}).value||"";const body={role:r,name:v("name").trim(),code:v("code").trim()};if(r==="lnt")body.prom=v("sup");if(r==="ln")body.lnt=v("sup");return saveWorker(body,v("pin"));}
  if(A==="setpin")return saveWorker({id:$("#pw_who").value},$("#pw_pin").value);
  if(A==="deactivate"){const w=IX.w[$("#pw_who").value];if(w&&confirm("Remove "+w.name+"? She will no longer be able to sign in."))return saveWorker({id:w.id,active:false},"");}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.cfgstart&&el.value&&me().role==="admin"){setStart(el.value);render();}});

/* start-up: a signed-in worker goes straight to her work; otherwise the welcome screen */
async function boot(){await IDB.open();const st=IDB.db?await IDB.get("state"):null;
  if(st&&st.mode==="live"&&st.auth){L.mode="live";LIVE=true;L.auth=st.auth;L.seq=st.seq||0;L.meta=st.meta||{};L.dirty=st.dirty||{};L.last=st.last||null;applyCfg(st.cfg);
    S.w.push(...(st.w||[]));for(const ty of TYPES)S[ty].push(...((st.recs||{})[ty]||[]));index();for(const ty of TYPES)for(const r of S[ty])SNAP.set(rk(ty,r.id),JSON.stringify(r));
    lastCfg=JSON.stringify(cfgPart());if(L.auth.worker)UI.who=L.auth.worker.id;}
  render();if(live()&&L.auth.token)sync();}

/* The welcome screen comes first; the app's own screens need a worker (example or signed in). */
const renderApp=render;
render=function(){if(!L.mode||(live()&&!(L.auth&&L.auth.token))){if(live())L.welcome="login";document.body.classList.remove("census");$("#app").innerHTML=vWelcome();return;}
  $("#role").hidden=live();renderApp();if(live())hdr();};
const welcomeOff=()=>document.body.classList.remove("census");

boot();
</script>
